name: 声の一覧と約束を取る

# エンジンに入っている声の一覧（policies/speakers.json）と、声ごとの約束の文（policies/<名前>.md）を取る。手で動かすだけ
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  policies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ['50021:50021']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: VOICEVOX が起きるのを待つ
        run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version && echo && exit 0; sleep 5; done
          echo "VOICEVOX のエンジンが起きなかった"; exit 1
      - run: node scripts/policies.mjs
      - name: policies を main に入れる
        run: |
          git config user.name "koe-irai"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A policies
          if git diff --cached --quiet; then echo "変わりなし"; exit 0; fi
          git commit -m "声の一覧と約束を取った（${GITHUB_RUN_ID}）"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
