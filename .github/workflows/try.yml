name: ためし（枝）

# koe-try/** の枝に push すると、scripts/try/try.mjs で声を作って artifact で出す（main には入れない・司令塔のためし）
on:
  push:
    branches: ['koe-try/**']

permissions:
  contents: write

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ['50021:50021']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: VOICEVOX が起きるのを待つ
        run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version && echo && exit 0; sleep 5; done
          exit 1
      - run: node scripts/try/try.mjs
      - name: 50ms ごとの音の大きさ
        run: |
          for f in out-try/*.mp3; do
            echo "$f $(ffmpeg -i "$f" -af 'asetnsamples=n=2205,astats=metadata=1:reset=1,ametadata=print:key=lavfi.astats.Overall.RMS_level' -f null - 2>&1 | grep -o 'RMS_level=[-0-9.inf]*' | cut -d= -f2 | awk '{printf "%s ", ($1=="-inf")?"-99":int($1)}')" | tee -a out-try/rms.txt
          done
      - name: 枝にのせる（司令塔が取る）
        run: |
          rm -f out-try/*.wav
          git config user.name "koe-irai"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out-try && git commit -q -m "ためしの音（${GITHUB_RUN_ID}）" && git push
