# まぜまぜおかし屋（11/22 しょーくん：夜でまだ声がない場面を4つとも作る）
# ① こね生地・キャンディの見せ場（ほかのビルドの「焦げた／冷えた／熟した」にあたる声）：パン種ができたとき（ほのか）・れんさが続いたとき（みなも）
# ② おもてなし！を押したとき（バトルのはじまり）③ 1万こえの一撃・オーバーランのとき（おどろく）④ ビルドをえらんだとき（これにする！）
# 長めの文のほうが自然に読める（短い掛け声は弱い・11/22）。無料枠の回数を考えて2本ずつ
# 口調は claude/okashi-story.md：ほのか＝元気／みなも＝……ではじまる・そっけない／わかば＝おっとり・〜ねぇ・〜わぁ
engine: gemini
takes: 2
lines:
  # ---------- ① 見せ場 ----------
  - id: hono-tane1
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。パン生地をこねていたら、ふっくらパン種が生まれて、うれしくてはしゃぐ。明るく元気に
    text: こねこね……ふっくら、パン種できた！
  - id: hono-tane2
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。パン生地をこねていたら、ふっくらパン種が生まれて、うれしくてはしゃぐ。明るく元気に
    text: やった、パン種がふえたよ！
  - id: mina-chain1
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。キャンディがきれいに続いて、小さく満足している
    text: ……きれいに、つながった
  - id: mina-chain2
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。キャンディがどんどん続いて、静かに気持ちがのってきた
    text: ……まだ、つながる
  # ---------- ② おもてなし！を押したとき ----------
  - id: hono-go1
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。夜のおもてなしの始まり。お客さんのモンスターに、こぶしをあげて元気いっぱいに
    text: いっくよー！ おもてなし、スタート！
  - id: hono-go2
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。夜のおもてなしの始まり。お客さんのモンスターに、明るくはりきって
    text: さあ、めしあがれー！
  - id: mina-go1
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。おもてなしの始まり。静かに、でも少しだけ気合いをこめて
    text: ……いくよ。見てて
  - id: mina-go2
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。おもてなしの始まり。静かに、でも少しだけ気合いをこめて
    text: ……さあ、おもてなし
  - id: waka-go1
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。おもてなしの始まり。お客さんにほほえみかけて、やさしく
    text: うふふ、めしあがれぇ
  - id: waka-go2
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。おもてなしの始まり。お客さんにほほえみかけて、やさしく
    text: さあ、おもてなしの時間よぉ
  # ---------- ③ 1万こえの一撃・オーバーラン ----------
  - id: hono-wow1
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。ものすごい一撃が出て、目を丸くして大よろこび。大きな声で
    text: すっごーい！
  - id: hono-wow2
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。ものすごい一撃が出て、目を丸くして大よろこび。大きな声で
    text: わぁっ、すごいの出ちゃった！
  - id: mina-wow1
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。ものすごい一撃が出て、めずらしく少しおどろいている
    text: ……今の、すごかった
  - id: mina-wow2
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。ものすごい一撃が出て、めずらしく少しおどろいている
    text: ……え。すごい
  - id: waka-wow1
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。ものすごい一撃が出て、手を口にあてておどろき、うれしそうに
    text: あらあら、すごいわぁ！
  - id: waka-wow2
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。ものすごい一撃が出て、手を口にあてておどろき、うれしそうに
    text: まぁ、こんなにたくさん……！
  # ---------- ④ ビルドをえらんだとき ----------
  - id: hono-pick
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。今夜のおもてなしをまかされて、胸をたたいて元気に
    text: よーし、まかせて！
  - id: mina-pick
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。今夜のおもてなしをまかされて、静かにうなずく
    text: ……ん。まかせて
  - id: waka-pick
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。今夜のおもてなしをまかされて、ほほえんでやさしく
    text: うふふ、まかせてねぇ
