# まぜまぜおかし屋：夜の戦闘の声を足す（11/21 リーダー【okashi】・しょーくん「大作ができたときの ほのか『できた！』みなも『完成。』わかば『できた』とか色々」
# えらぶ質問で場面を決めた：★3（大作）ができた・ラウンドでおなか満タン・必殺技の大きい一撃・ビルドの見せ場（焦げた・冷えた・熟した）
# 11/21 14時 しょーくん：hono-dekita・waka-dekita・hono-ikke は「どっちも×」→ 言い方を変えて3本ずつ作りなおす。ほかはえらんで assets/koe に入れた
# 11/21 14時すぎ：waka-dekita＝3本め・hono-ikke＝2本め をえらんだ。hono-dekita はまた×「最後のばさずに切って元気よく」→ できたっ！で作りなおす
# 11/21 14時半：「3音とも短く・勢いがある感じ」→ 早口で一気に（3回め）
# ことばごとに2本ずつ作って、しょーくんが聞きくらべでえらぶ（えらんだら mazemaze-okashiya の assets/koe へ）。声と言い方は kakegoe-gemini.yml と同じ
engine: gemini
takes: 2
lines:
  - id: hono-dekita
    voice: Leda
    takes: 3
    style: 元気な見習いパティシエの女の子（十代後半）。お菓子が完成した瞬間、思わず口から飛び出す一言。早口で一気に、勢いよく。「で」「き」「た」の3つの音はどれも短く、どの音ものばさない。全体で0.5秒くらいの、はずむような短い叫び
    text: できたっ！
  - id: mina-kansei
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。攻撃のときの小さな気合い。短く鋭く。飴細工の大作が完成した瞬間。静かに、でも誇らしげに短く言い切る
    text: 完成。
  - id: waka-dekita
    voice: Achernar
    takes: 3
    style: おっとりした優しいお姉さん。ゆったり、ふんわり、ほほえみながら。大きなくだもののお菓子が完成して、両手をあわせて ほっこりうれしそう。やさしく、語尾を少しのばして
    text: できたわぁ
  - id: hono-yattane
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。お客さんのおなかがいっぱいになって、ガッツポーズで元気に
    text: やったね！
  - id: mina-joudeki
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。攻撃のときの小さな気合い。短く鋭く。うまくいったときに、小さく満足そうに。少し間をおいてから
    text: 上出来。
  - id: waka-iikao
    voice: Achernar
    style: おっとりした優しいお姉さん。ゆったり、ふんわり、ほほえみながら。お客さんが満足した顔を見て、うれしそうに笑いながら
    text: うふふ、いいお顔
  - id: hono-ikke
    voice: Leda
    takes: 3
    style: 元気な見習いパティシエの女の子（十代後半）。夜のおもてなしバトルの、いちばん大きな必殺の一撃。お菓子に全部の気持ちをこめて、腹の底から力いっぱい叫ぶ。熱血アニメの主人公のように勢いよく
    text: いっけええ！
  - id: mina-korede
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。攻撃のときの小さな気合い。短く鋭く。いちばん大きな一撃を放つ瞬間。低めに、静かに、でも鋭く決める
    text: これで。
  - id: waka-soree
    voice: Achernar
    style: おっとりした優しいお姉さん。ゆったり、ふんわり、ほほえみながら。いちばん大きな一撃。ふだんよりちょっと力を入れて、かわいく元気に
    text: それーっ！
  - id: hono-achi
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。生地を焦がしてしまって、熱さにびっくり。短く、あわてて
    text: あちっ！
  - id: mina-hieta
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。攻撃のときの小さな気合い。短く鋭く。飴が冷えて固まった瞬間。静かに、手ごたえを感じて
    text: 冷えた。
  - id: waka-jukushita
    voice: Achernar
    style: おっとりした優しいお姉さん。ゆったり、ふんわり、ほほえみながら。くだものが熟した瞬間。うっとり、のんびりうれしそうに
    text: 熟したわぁ
