# まぜまぜおかし屋（11/22 しょーくん「ほのかの火力マックスとか、みなもの凍ったときの いい感じ とかも欲しい」）
# ほのか：バトルで火力がマックスになったとき（hono-max）／みなも：大作が冷えたとき（いまの「冷えた。」mina-hieta と かわりばんこ・mina-iikanji）
# ことばを2つずつ・3本ずつ作って聞きくらべ（えらんだ1本を hono-max・mina-iikanji の名前でゲームに入れる）
engine: gemini
takes: 3
lines:
  - id: hono-max1
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。オーブンの火がごうっと燃えあがって、テンションが一気に上がる。こぶしをにぎって、元気いっぱいに
    text: よーし、火力マックス！
  - id: hono-max2
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。オーブンの火がごうっと燃えあがって、テンションが一気に上がる。こぶしをにぎって、元気いっぱいに
    text: 火力、マックスー！ いっくよー！
  - id: mina-iikanji1
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。飴細工がちょうどよく冷えて固まり、小さく満足してうなずく
    text: ……ん、いい感じ
  - id: mina-iikanji2
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。飴細工がちょうどよく冷えて固まり、小さく満足してうなずく
