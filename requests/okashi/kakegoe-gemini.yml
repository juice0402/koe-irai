# まぜまぜおかし屋：3人の掛け声を Gemini で（11/21 しょーくん：ほのか＝Leda・3人とも Gemini・声にするのは掛け声だけ）
# 無料枠の回数を使いすぎないように、1人ぶんの掛け声を1本にまとめて作り、昼のチャットが無音で切り分けて assets/koe に入れる（id はゲームと同じ hono-ei など）
# みなも・わかばは声を2つずつ聞きくらべ（えらんだら使わないほうの行は消す）
# 11/21 しょーくんがえらんだ：ほのか＝Leda・みなも＝Despina（もう少し高く）・わかば＝Achernar。わぁ（ほのか）・あらあら（わかば）はセリフごとなくす
# 11/21 みなもの1回目は「は」「ふ」「ん」が短すぎて息の音になり、切り分けがずれた → はっ・ふっ・うん に（しょーくん「短すぎると入らない？」）
engine: gemini
takes: 1
lines:
  - id: hono-all
    voice: Leda
    takes: 2
    style: 元気な見習いパティシエの女の子。お菓子づくりの掛け声を、ひとつずつしっかり間をあけて言う。えい・や・それ は気合いをこめて短く、わぁ は目をかがやかせて、やった は大よろこび、よーし はやる気まんまん、んー は首をかしげて考えこむ、あちゃー は失敗してしょんぼり
    text: "えい！\nや！\nそれ！\nわぁ！\nやった！\nよーし！\nんー。\nあちゃー。"
  - id: waka-all-achernar
    voice: Achernar
    style: おっとりした優しいお姉さん。ゆったり、ふんわり、ほほえみながら。ひとつずつしっかり間をあけて言う。それ・えい は力をぬいてかわいく、うふふ は上品に笑う、あらあら・まぁ はやさしくおどろく、うーん はのんびり考える
    text: "それっ。\nえいっ。\nうふふ。\nあらあら。\nまぁ。\nうーん。"
  # 11/21 しょーくん「やったーは伸ばしすぎ・やった！みたいな元気な感じ」→ やった！だけ3本
  - id: hono-yatta
    voice: Leda
    takes: 3
    style: 元気な見習いパティシエの女の子。新しいお菓子ができてうれしくて、思わず短く「やった！」。のばさずに、パッと元気に言い切る
    text: やった！
  # 11/21 まとめて読むと切り分けがずれる（息の音が入る）→ みなも（Despina）はことばごとに2本ずつ
  - id: mina-ha
    voice: Despina
    takes: 2
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。攻撃のときの小さな気合い。短く鋭く
    text: はっ。
  - id: mina-fu
    voice: Despina
    takes: 2
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。攻撃のときに小さく息をはく気合い。短く、でも声に出す
    text: ふっ。
  - id: mina-n
    voice: Despina
    takes: 2
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。そっけなく小さくうなずく
    text: うん。
  - id: mina-yoshi
    voice: Despina
    takes: 2
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。うまくいって、静かに小さくガッツポーズ
    text: よし。
  - id: mina-uun
    voice: Despina
    takes: 2
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。うまくいかなくて、少しむっとして考えこむ
    text: んー。
