# まぜまぜおかし屋：3人の掛け声を Gemini で（11/21 しょーくん：ほのか＝Leda・3人とも Gemini・声にするのは掛け声だけ）
# 無料枠の回数を使いすぎないように、1人ぶんの掛け声を1本にまとめて作り、昼のチャットが無音で切り分けて assets/koe に入れる（id はゲームと同じ hono-ei など）
# みなも・わかばは声を2つずつ聞きくらべ（えらんだら使わないほうの行は消す）
# 11/21 しょーくんがえらんだ：ほのか＝Leda・みなも＝Despina（もう少し高く）・わかば＝Achernar。わぁ（ほのか）・あらあら（わかば）はセリフごとなくす
# 11/21 みなもの1回目は「は」「ふ」「ん」が短すぎて息の音になり、切り分けがずれた → はっ・ふっ・うん に（しょーくん「短すぎると入らない？」）
engine: gemini
takes: 1
lines:
  - id: hono-all
    voice: Leda
    takes: 2
    style: 元気な見習いパティシエの女の子。お菓子づくりの掛け声を、ひとつずつしっかり間をあけて言う。えい・や・それ は気合いをこめて短く、わぁ は目をかがやかせて、やった は大よろこび、よーし はやる気まんまん、んー は首をかしげて考えこむ、あちゃー は失敗してしょんぼり
    text: "えい！\nや！\nそれ！\nわぁ！\nやった！\nよーし！\nんー。\nあちゃー。"
  - id: waka-all-achernar
    voice: Achernar
    style: おっとりした優しいお姉さん。ゆったり、ふんわり、ほほえみながら。ひとつずつしっかり間をあけて言う。それ・えい は力をぬいてかわいく、うふふ は上品に笑う、あらあら・まぁ はやさしくおどろく、うーん はのんびり考える
    text: "それっ。\nえいっ。\nうふふ。\nあらあら。\nまぁ。\nうーん。"
  # 11/21 しょーくん「やったーは伸ばしすぎ・やった！みたいな元気な感じ」→ やった！だけ3本
  - id: hono-yatta
