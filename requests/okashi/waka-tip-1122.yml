# まぜまぜおかし屋（11/22 しょーくん）
# ① わかばの声をもう一度：ゲームで使っている10こを、同じ声（Achernar）で3本ずつ作りなおして、聞きくらべのページで今のとくらべてえらぶ
# ② チュートリアルの声：夜のヒント3つ（ショップ・おもてなし！・まぜまぜ）の文を、ほのか（Leda）が読む。3本ずつ作ってえらぶ
#    文は昼のチャットの story.js の STORY.tips と同じ（読みまちがえる字はかなに）
engine: gemini
takes: 3
lines:
  # ---------- わかば（Achernar）：攻撃の掛け声 ----------
  - id: waka-sore
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。夜のおもてなしバトルで、くだものをくり出すときの短い掛け声。息だけにせず、ふんわりした声ではっきり、かわいく軽やかに言い切る
    text: それっ。
  - id: waka-ei
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。夜のおもてなしバトルで、くだものをくり出すときの短い掛け声。息だけにせず、ふんわりした声ではっきり、かわいく軽やかに言い切る
    text: えいっ。
  - id: waka-hoi
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。夜のおもてなしバトルで、くだものをくり出すときの短い掛け声。息だけにせず、ふんわりした声ではっきり、かわいく軽やかに言い切る
    text: ほいっ。
  - id: waka-eei
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。夜のおもてなしバトルで、くだものをくり出すときの掛け声。少しだけ力を入れて、かわいく元気に。息だけにせず、はっきり声に出す
    text: えーいっ。
  # ---------- わかば：場面の声 ----------
  - id: waka-dekita
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。大きなくだもののお菓子が完成して、両手をあわせて ほっこりうれしそう。やさしく、語尾を少しのばして
    text: できたわぁ
  - id: waka-iikao
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。お客さんが満足した顔を見て、うれしそうに小さく笑いながら、やさしく
    text: うふふ、いいお顔
  - id: waka-soree
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。いちばん大きな一撃。ふだんよりちょっと力を入れて、かわいく元気に
    text: それーっ！
  - id: waka-jukushita
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。くだものが熟した瞬間。うっとり、のんびりうれしそうに
    text: 熟したわぁ
  - id: waka-ufufu
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。お客さんが大満足してくれて、口もとに手をあてて上品に、うれしそうに笑う
    text: うふふっ。
  - id: waka-uun
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。どのくだものを使おうか、首をかしげて のんびり考えこむ。息だけにせず、やわらかい声で
    text: うーん
  # ---------- ほのか（Leda）：チュートリアルのヒント ----------
  - id: hono-tip-shop1
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。はじめて夜のお店を手伝ってくれる人に、となりで明るくやさしく教えてあげる。テンポよく、聞き取りやすく、自然な声で
    text: カードを、下の ちょうりだいへ ドラッグ！ いちラウンドめは、さんまい タダだよ！
  - id: hono-tip-bake
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。はじめて夜のお店を手伝ってくれる人に、となりで明るくやさしく教えてあげる。テンポよく、聞き取りやすく、自然な声で
    text: じゅんびができたら、おもてなし！を タップして、おなかいっぱいに！
  - id: hono-tip-mix
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。はじめて夜のお店を手伝ってくれる人に、となりで明るくやさしく教えてあげる。テンポよく、聞き取りやすく、自然な声で
    text: かさねると、まぜまぜできるよ！ まぜると、ほしが上がるんだよ
