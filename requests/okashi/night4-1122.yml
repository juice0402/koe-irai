# まぜまぜおかし屋（11/22 しょーくん：night3-1122 の聞きくらべ その3 のあと）
# hono-tane1：「パン種できた！」くらいに短く（前の「こねこね……ふっくら、パン種できた！」は使わない）
# mina-chain1：前のは声の前に へんなノイズが入っていた → 作りなおし（文はそのまま）
# mina-wow1：「今の」を「こんの」と読んだ → かなで「いまの」
# 3本ずつ作って聞きくらべ（えらんだ1本を同じ名前でゲームに入れる）
engine: gemini
takes: 3
lines:
  - id: hono-tane1
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。パン生地をこねていたら、ふっくらパン種が生まれて、うれしくて弾むように。明るく元気に
    text: パン種、できた！
  - id: mina-chain1
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。声の前に息や音を入れない。キャンディがきれいに続いて、小さく満足している
    text: ……きれいに、つながった
  - id: mina-wow1
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。ものすごい一撃が出て、めずらしく少しおどろいている
    text: ……いまの、すごかった
