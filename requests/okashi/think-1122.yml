# まぜまぜおかし屋（11/22 しょーくん「ショップで考え中の読み上げバリエーションを増やそう・文章のほうが得意っぽい・迷うなぁ／どれにしようかな もあり・キャラの性格に合わせて3種類くらい」）
# 夜のショップで、カードを選んでいるときに1ラウンド1回鳴る「考えている声」。いまの んー（hono-uun・mina-uun・waka-uun）に3つずつ足す。3本ずつ作って聞きくらべ
# 口調は claude/okashi-story.md・okashi-scenario.md：ほのか＝元気・〜かな／みなも＝……ではじまる短いことば・そっけない／わかば＝おっとり・〜ねぇ・〜わぁ・あらあら
# waka-tip-1122.yml でえらんだ声（11/22 しょーくん）：waka-ei＝2本め・waka-eei＝1本め・waka-dekita＝1本め・waka-soree＝3本め・waka-jukushita＝3本め・waka-uun＝3本め・hono-tip-shop1＝3本め・hono-tip-bake＝3本め（ゲームの assets/koe にコピーずみ）。waka-sore・hoi・iikao・ufufu は前のまま・hono-tip-mix は声なし
engine: gemini
takes: 3
lines:
  # ---------- ほのか（Leda） ----------
  - id: hono-think1
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。夜のお店で、ならんだカードを見くらべて、あごに指をあてて考えこむ。ひとりごとのように、明るく自然に
    text: うーん、どれにしようかなぁ
  - id: hono-think2
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。どれもよさそうで決められず、うれしそうに迷っている。ひとりごとのように、明るく自然に
    text: 迷うなぁ……どれもおいしそう！
  - id: hono-think3
    voice: Leda
    style: 元気な見習いパティシエの女の子（十代後半）。カードを見ていて、いいことを思いついてわくわく。ひとりごとのように、明るく自然に
    text: これとこれ、まぜたらどうなるかな？
  # ---------- みなも（Despina） ----------
  - id: mina-think1
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。カードを見くらべて、静かに考えている小さなひとりごと
    text: ……どれに、しよう
  - id: mina-think2
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。めずらしく決められなくて、少しこまっている小さなひとりごと
    text: ……迷う。どれも、いい
  - id: mina-think3
    voice: Despina
    style: クールで口数の少ない飴細工職人の女の子（十代後半）。落ち着いた声だけど低くしすぎず、若い女の子らしい少し高めの声。息だけにせず、はっきり声に出す。じっと見て、ひとつにしぼりかけている小さなひとりごと
    text: ……ん。これ、かな
  # ---------- わかば（Achernar） ----------
  - id: waka-think1
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。ほおに手をあてて、のんびりカードを見くらべる。ゆったり、ふんわり、ひとりごとのように
    text: どれにしようかしらねぇ
  - id: waka-think2
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。どれもすてきで決められず、うれしそうに迷っている。ゆったり、ふんわり、ひとりごとのように
    text: あらあら、迷っちゃうわぁ
  - id: waka-think3
    voice: Achernar
    style: おっとりした優しいお姉さんのパティシエ（二十代前半）。ならんだカードを見て、うっとり。ゆったり、ふんわり、ひとりごとのように
    text: うーん、どれもおいしそうねぇ
